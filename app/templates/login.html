<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Entrar · Escala &amp; Banco de Horas</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: {50:'#ecfdf5',100:'#d1fae5',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'} },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['JetBrains Mono','monospace'] }
    }}}
  </script>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <style> body { -webkit-font-smoothing: antialiased; font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-emerald-800 via-emerald-700 to-teal-600 flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="flex flex-col items-center text-center">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </div>
      <h1 class="mt-4 text-xl font-bold tracking-tight text-slate-900">Escala &amp; Banco de Horas</h1>
      <p class="mt-1 text-sm text-slate-500">Acesso restrito · informe sua senha para continuar</p>
    </div>

    {% if aviso %}
      <div class="mt-6 bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-sm text-emerald-800">{{ aviso }}</div>
    {% endif %}
    {% if erro %}
      <div class="mt-6 bg-rose-50 border border-rose-200 rounded-xl p-3 text-sm text-rose-800">❌ {{ erro }}</div>
    {% endif %}

    <form method="post" action="/login" class="mt-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="senha">Senha</label>
        <input autofocus class="w-full text-sm rounded-lg border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 shadow-xs py-2.5 px-3" id="senha" name="senha" placeholder="••••••••" required type="password"/>
      </div>
      <button class="w-full inline-flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-emerald-700 hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors" type="submit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        Entrar
      </button>
    </form>

    {% if usando_senha_padrao %}
      <p class="mt-4 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
        ⚠️ A senha padrão <code class="bg-amber-100 px-1 rounded">admin123</code> está ativa. Defina <code class="bg-amber-100 px-1 rounded">ADMIN_PASSWORD</code> no arquivo <code class="bg-amber-100 px-1 rounded">.env</code>.
      </p>
    {% endif %}
  </div>
</body>
</html>
