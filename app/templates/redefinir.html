<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- Marca: favicons e manifest do kit Chronos (design/logo/kit) -->
  <link rel="icon" href="/static/brand/favicon.ico?v=1" sizes="48x48"/>
  <link rel="icon" href="/static/brand/favicon.svg?v=1" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v=1"/>
  <link rel="manifest" href="/static/brand/site.webmanifest"/>
  <title>Nova senha · Chronos</title>
  <script>
    // Aplica o tema salvo (ou o do sistema) antes de qualquer pintura, evitando flash branco
    (function () {
      var salvo = null;
      try { salvo = localStorage.getItem('tema'); } catch (e) {}
      var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (escuro) document.documentElement.classList.add('dark');
    })();
  </script>
  <!-- CSS gerado localmente (npm run build:css) — sem depender de CDN -->
  <link rel="stylesheet" href="/static/css/app.css?v=4"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <style>
    body { -webkit-font-smoothing: antialiased; font-family: 'Inter', sans-serif; }
    /* Títulos: Plus Jakarta Sans (guia da marca §5) */
    h1, h2 { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-brand-800 via-brand-700 to-brand-600 flex items-center justify-center p-4">

  <button id="botao-tema" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro" type="button"
          class="fixed top-4 right-4 p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors">
    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewbox="0 0 24 24" aria-hidden="true">
      <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
    </svg>
    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewbox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
    </svg>
  </button>

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="flex flex-col items-center text-center">
    <!-- Logo empilhado da marca (tela de login — guia §1; respiro 1×E, guia §2) -->
    <img src="/static/brand/chronos-stacked.svg?v=1" alt="Chronos — Logo Empilhado"
         class="h-32 sm:h-36 w-auto mx-auto"/>
    <h1 class="sr-only">Chronos</h1>
    <p class="mt-4 text-sm text-slate-500">Escolha uma nova senha</p>
    </div>

    {% if aviso %}
      <div class="mt-6 bg-brand-50 border border-brand-200 rounded-xl p-3 text-sm text-brand-800">{{ aviso }}</div>
    {% endif %}
    {% if erro %}
      <div class="mt-6 bg-rose-50 border border-rose-200 rounded-xl p-3 text-sm text-rose-800">❌ {{ erro }}</div>
    {% endif %}

    <form id="form-redefinir" method="post" action="/redefinir-senha" class="hidden mt-6 space-y-4">
      <input type="hidden" id="access_token" name="access_token" value=""/>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="senha">Nova senha (mínimo 6 caracteres)</label>
        <input autofocus autocomplete="new-password" minlength="6" class="w-full text-sm rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500 shadow-xs py-2.5 px-3" id="senha" name="senha" placeholder="••••••••" required type="password"/>
      </div>
      <button class="w-full inline-flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-brand-700 hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors" type="submit">Salvar nova senha</button>
    </form>
    <p id="sem-token" class="hidden mt-6 bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800">
      Link inválido ou expirado. <a href="/esqueci" class="font-medium text-brand-700 hover:text-brand-800">Peça um novo link</a>.
    </p>
    <p class="mt-5 text-center text-xs text-slate-500"><a href="/login" class="font-medium text-brand-700 hover:text-brand-800">Voltar para entrar</a></p>
  </div>

  <script>
    // O Supabase entrega o token no fragmento da URL (#access_token=...&type=recovery)
    (function () {
      var p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var token = p.get('access_token');
      var campo = document.getElementById('access_token');
      var form = document.getElementById('form-redefinir');
      var sem = document.getElementById('sem-token');
      if (token && campo) {
        campo.value = token;
        form.classList.remove('hidden');
        history.replaceState(null, '', location.pathname);
      } else if (sem) {
        sem.classList.remove('hidden');
      }
    })();
  </script>
  <script>
    (function () {
      var botao = document.getElementById('botao-tema');
      botao.addEventListener('click', function () {
        var escuro = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('tema', escuro ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
